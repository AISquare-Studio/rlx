version: 2
updates:
  # Keep GitHub Actions pinned actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep Python dependencies current.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # Keep rlxd's Cargo dependencies current (rlxd/Cargo.lock). rlxd.yml's cargo deny
  # job checks each update's licences and advisories.
  - package-ecosystem: cargo
    directory: "/rlxd"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
