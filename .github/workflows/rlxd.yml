name: rlxd

# The rlxd Cargo workspace (rlxd/), on the three OSes it ships for (handoff 0.10.3,
# 1.1). ci.yml runs the Python suite; this runs the Rust one. A PR gets it when it
# touches rlxd/ (Cargo.lock included), this file, or pyproject.toml, whose version
# rlxd/crates/rlxd/tests/version.rs holds rlxd's to. Every push to main or an
# rc/** branch runs it whatever changed, as does a run by hand
# (`gh workflow run rlxd.yml --ref <branch>`).
on:
  pull_request:
    paths:
      - "rlxd/**"
      - ".github/workflows/rlxd.yml"
      - ".github/workflows/rlxd-release.yml"
      - "scripts/rlxd_archive.py"
      - "src/aisquare/services/rlxd_install.py"
      - "src/aisquare/cli/daemon.py"
      - "tests/stub_releases.py"
      - "tests/test_rlxd_install.py"
      - "pyproject.toml"
  push:
    branches: [main, "rc/**"]
  workflow_dispatch:
    # rlxd-release.yml's attach, by hand (1.2): a dry run unless dry_run is unticked.
    inputs:
      release_tag:
        description: Also attach the archives to this GitHub Release (vX.Y.Z, pyproject.toml's version on this ref). Empty builds and packages only.
        required: false
        type: string
        default: ""
      dry_run:
        description: With release_tag, check everything and print the upload instead of running it.
        required: false
        type: boolean
        default: true

# Cancel superseded runs on the same branch/PR, grouped by event as ci.yml's are, so a
# run by hand never cancels a push's run or the other way round.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# rustup picks the toolchain from rlxd/rust-toolchain.toml only when cargo runs inside
# rlxd/, so every step does.
defaults:
  run:
    shell: bash
    working-directory: rlxd

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rustup is on every hosted runner; with no argument it installs what
      # rust-toolchain.toml pins, rustfmt and clippy included.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rlxd -> target

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build --release
        run: cargo build --workspace --release --locked

      # --release reuses the build above rather than building gen-schemas again.
      - name: schemas/v1 matches rlxd-proto
        run: cargo run --release --locked -p rlxd-proto --bin gen-schemas -- --check

  # Licences and RustSec advisories, once: the dependency graph is the same on every
  # OS, since cargo-deny reads every target's dependencies wherever it runs.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1

      - name: cargo deny check
        run: cargo deny --locked check

  # 1.2: rlxd and rlxd-hook for the five targets, as the artifact `rlxd-archives`,
  # installed by `rlx daemon install` on each OS (rlxd-release.yml). It attaches to a
  # release only with a release_tag given by hand, and then only if dry_run is off.
  # contents: write is for that attach job alone; rlxd-release.yml holds every other
  # job to read.
  release:
    name: release
    uses: ./.github/workflows/rlxd-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.release_tag || '' }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
