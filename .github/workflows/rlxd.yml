name: rlxd

# The rlxd Cargo workspace (rlxd/), on the three OSes it ships for (handoff 0.10.3,
# 1.1). ci.yml runs the Python suite; this runs the Rust one, plus the daemon
# registry's two cross-language tests (4.1), which need both. A PR gets it when it
# touches rlxd/ (Cargo.lock included), this file, pyproject.toml, whose version
# rlxd/crates/rlxd/tests/version.rs holds rlxd's to, or the Python side of the
# registry's shared format. Every push to main or an rc/** branch runs it whatever
# changed, as does a run by hand (`gh workflow run rlxd.yml --ref <branch>`).
on:
  pull_request:
    paths:
      - "rlxd/**"
      - ".github/workflows/rlxd.yml"
      - "pyproject.toml"
      - "src/aisquare/core/daemons.py"
      - "src/aisquare/core/locking.py"
      - "src/aisquare/core/registry.py"
      - "tests/test_daemon_registry.py"
  push:
    branches: [main, "rc/**"]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR, grouped by event as ci.yml's are, so a
# run by hand never cancels a push's run or the other way round.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# rustup picks the toolchain from rlxd/rust-toolchain.toml only when cargo runs inside
# rlxd/, so every step does.
defaults:
  run:
    shell: bash
    working-directory: rlxd

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The registry's interop tests skip where neither this nor RLXD_BIN is set (the
    # Python suite, a checkout with no uv). Here they must run: a missing uv or rlxd
    # fails them.
    env:
      RLXD_INTEROP_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rustup is on every hosted runner; with no argument it installs what
      # rust-toolchain.toml pins, rustfmt and clippy included.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rlxd -> target

      # For the registry's interop tests: registry_interop (in cargo test) runs Python's
      # registry through `uv run python`, and the last step runs its pytest. Pinned as
      # ci.yml pins it.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build --release
        run: cargo build --workspace --release --locked

      # --release reuses the build above rather than building gen-schemas again.
      - name: schemas/v1 matches rlxd-proto
        run: cargo run --release --locked -p rlxd-proto --bin gen-schemas -- --check

      # 4.1: Python's registry reads the real rlxd as live while it runs, and as dead
      # after a stop or a kill.
      - name: Python's registry reads rlxd (test_daemon_registry.py)
        working-directory: .
        env:
          RLXD_BIN: ${{ github.workspace }}/rlxd/target/release/rlxd${{ runner.os == 'Windows' && '.exe' || '' }}
        run: uv run --extra dev pytest tests/test_daemon_registry.py -q -p no:cacheprovider

  # Licences and RustSec advisories, once: the dependency graph is the same on every
  # OS, since cargo-deny reads every target's dependencies wherever it runs.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1

      - name: cargo deny check
        run: cargo deny --locked check

  # `rlxd here` over a real `ssh localhost` (the owner's remote brief, §3), as rlx.app runs
  # it: by absolute path, in a non-login session that has not read the user's profile. It
  # must give the answer `env -i HOME=$HOME rlxd here --json` gives locally, in each state.
  # sshd is the runner's own, key-only, with the host key pinned in known_hosts first.
  # Forwarding the socket over SSH (direct-streamlocal) can extend this job.
  ssh:
    name: rlxd here over ssh (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rlxd -> target

      # check-jsonschema, for the schema checks below.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.0"

      - name: cargo build
        run: cargo build --locked -p rlxd

      - name: Start sshd on localhost, key-only
        run: |
          if ! command -v sshd >/dev/null && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          chmod go-w ~
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -t ed25519 localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes localhost true
          echo "a non-login session's PATH: $(ssh -o BatchMode=yes localhost 'echo $PATH')"

      # The step's shell is `bash -e`: an exit the check expects, 3 or 127, is caught
      # with `|| code=$?`.
      - name: rlxd here gives the same answer over ssh as locally
        working-directory: .
        run: |
          rlxd="$PWD/rlxd/target/debug/rlxd"
          over_ssh() { ssh -o BatchMode=yes localhost "$@"; }
          # `rlxd here --json` locally with nothing but HOME, and over ssh, into
          # <state>-local.json and <state>-ssh.json. Both must exit $2 and match.
          both() {
            local state=$1 want=$2 code
            code=0; env -i HOME="$HOME" "$rlxd" here --json > "$state-local.json" || code=$?
            [ "$code" = "$want" ] || { echo "::error::$state: local exit $code, not $want"; exit 1; }
            code=0; over_ssh "$rlxd here --json" > "$state-ssh.json" || code=$?
            [ "$code" = "$want" ] || { echo "::error::$state: ssh exit $code, not $want"; exit 1; }
            diff <(jq -S . "$state-local.json") <(jq -S . "$state-ssh.json") \
              || { echo "::error::$state: the answer over ssh differs"; exit 1; }
            jq -c .data "$state-ssh.json"
          }

          both stopped 3
          jq -e '.ok and .data.installed and (.data.running|not) and (.data|has("pid")|not)' stopped-ssh.json

          over_ssh "$rlxd here --json --start" > started-ssh.json
          jq -e '.ok and .data.running and .data.started and .data.pid > 0' started-ssh.json
          pid=$(jq .data.pid started-ssh.json)

          both running 0
          jq -e --argjson pid "$pid" --arg home "$HOME" '.data.running and (.data.started|not)
            and .data.pid == $pid and .data.socket == ($home + "/.aisquare/run/rlxd.sock")
            and .data.protocol_versions == [1]' running-ssh.json

          # The README's command, as an app sends it: rlxd found in ~/.local/bin by its
          # absolute path, as on a host whose non-login PATH lacks that folder (this
          # runner's has it, so the command runs it by path, not by name).
          snippet=$(python3 -c 'import re,sys; print(re.search(r"\n(sh -c .for d in .*?exit 127.)\n", open(sys.argv[1]).read()).group(1))' rlxd/README.md)
          mkdir -p ~/.local/bin
          cp "$rlxd" ~/.local/bin/rlxd
          over_ssh "$snippet" > snippet-ssh.json
          jq -e --argjson pid "$pid" '.data.running and .data.pid == $pid
            and (.data.rlxd.path|endswith("/.local/bin/rlxd"))' snippet-ssh.json

          uvx check-jsonschema==0.39.0 --schemafile rlxd/schemas/v1/envelope.json -- *-ssh.json *-local.json
          mkdir data
          for answer in *-ssh.json *-local.json; do jq .data "$answer" > "data/$answer"; done
          uvx check-jsonschema==0.39.0 --schemafile rlxd/schemas/v1/here-reply.json -- data/*.json

          over_ssh "$rlxd stop"
          rm ~/.local/bin/rlxd
          code=0; over_ssh "$snippet" > /dev/null || code=$?
          [ "$code" = 127 ] || { echo "::error::with no rlxd the snippet exits $code, not 127"; exit 1; }
