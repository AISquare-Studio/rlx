name: rlxd

# The rlxd Cargo workspace (rlxd/), on the three OSes it ships for (handoff 0.10.3,
# 1.1). ci.yml runs the Python suite; this runs the Rust one, plus the daemon
# registry's two cross-language tests (4.1), which need both. A PR gets it when it
# touches rlxd/ (Cargo.lock included), this file, pyproject.toml, whose version
# rlxd/crates/rlxd/tests/version.rs holds rlxd's to, or the Python side of the
# registry's shared format. Every push to main or an rc/** branch runs it whatever
# changed, as does a run by hand (`gh workflow run rlxd.yml --ref <branch>`).
on:
  pull_request:
    paths:
      - "rlxd/**"
      - ".github/workflows/rlxd.yml"
      - ".github/workflows/rlxd-release.yml"
      - "scripts/rlxd_archive.py"
      - "src/aisquare/services/rlxd_install.py"
      - "src/aisquare/cli/daemon.py"
      - "tests/stub_releases.py"
      - "tests/test_rlxd_install.py"
      - "tests/test_rlxd_release_attach.py"
      - "tests/test_rlxd_release_features.py"
      - "pyproject.toml"
      - "src/aisquare/core/daemons.py"
      - "src/aisquare/core/locking.py"
      - "src/aisquare/core/registry.py"
      - "tests/test_daemon_registry.py"
  push:
    branches: [main, "rc/**"]
  workflow_dispatch:
    # rlxd-release.yml's attach, by hand (1.2): a dry run unless dry_run is unticked, and
    # run on the tag itself (`--ref vX.Y.Z`), which attach checks.
    inputs:
      release_tag:
        description: Also attach the archives to this GitHub Release (vX.Y.Z). Run on that tag (--ref vX.Y.Z); any other ref is refused. Empty builds and packages only.
        required: false
        type: string
        default: ""
      dry_run:
        description: With release_tag, check everything and print the upload instead of running it.
        required: false
        type: boolean
        default: true

# Cancel superseded runs on the same branch/PR, grouped by event as ci.yml's are, so a
# run by hand never cancels a push's run or the other way round.
# A newer run of a ref cancels the older, but never a dispatch with a release_tag: its
# attach may be part-way through `gh release upload --clobber`, and one cut off can leave
# the release with some archives replaced and the sums not. The release_tag is in the
# group, so such a run shares it only with dispatches attaching the same tag, which wait
# rather than cancel. A plain dispatch on the tag's ref (no release_tag) is in another
# group: it can neither cancel a running attach nor replace a pending one, as GitHub
# replaces a group's pending run with any newer one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# rustup picks the toolchain from rlxd/rust-toolchain.toml only when cargo runs inside
# rlxd/, so every step does.
defaults:
  run:
    shell: bash
    working-directory: rlxd

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The registry's interop tests skip where neither this nor RLXD_BIN is set (the
    # Python suite, a checkout with no uv). Here they must run: a missing uv or rlxd
    # fails them. Likewise the gate's peer checks that need `sudo -n` (Linux) or an
    # administrator (Windows) skip elsewhere, and must run here.
    env:
      RLXD_INTEROP_REQUIRED: "1"
      RLXD_GATE_PEER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rustup is on every hosted runner; with no argument it installs what
      # rust-toolchain.toml pins, rustfmt and clippy included.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rlxd -> target

      # For the registry's interop tests: registry_interop (in cargo test) runs Python's
      # registry through `uv run python`, and the last step runs its pytest. Pinned as
      # ci.yml pins it.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # The macOS gate tests sign a helper with a self-signed identity. macOS 15's
      # codesign finds identities only in keychains on the search list, which the tests
      # never write (tests/macos_signing). So this throwaway runner lists a keychain of
      # its own, and hands it to them.
      - name: A keychain for the gate's signing tests (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          kc="$RUNNER_TEMP/rlxd-gate-test.keychain-db"
          security create-keychain -p rlxd-gate-test "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p rlxd-gate-test "$kc"
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc" $existing
          echo "RLXD_GATE_TEST_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "RLXD_GATE_TEST_KEYCHAIN_PASSWORD=rlxd-gate-test" >> "$GITHUB_ENV"

      # 1.4: the PTY host's frame must equal tmux's capture-pane byte for byte, so the
      # tests compare against tmux itself, installed here for them only. With
      # RLXD_TMUX_REQUIRED, a missing tmux fails them rather than skipping.
      - name: tmux, for the frame tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          tmux -V
          echo "RLXD_TMUX_REQUIRED=1" >> "$GITHUB_ENV"

      - name: tmux, for the frame tests (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          tmux -V
          echo "RLXD_TMUX_REQUIRED=1" >> "$GITHUB_ENV"

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The gate's peer tests build only with the test-identity feature.
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # 5.1: the gate's peer identity check, against helpers signed or built with a test
      # identity that only the gate-test-requirement feature lets rlxd accept. Each test
      # compiles to nothing on the other OSes.
      - name: cargo test, the gate's peer checks (gate-test-requirement)
        run: >-
          cargo test -p rlxd --features gate-test-requirement --locked
          --test gate_peer_macos --test gate_peer_linux --test gate_peer_windows

      - name: cargo build --release
        run: cargo build --workspace --release --locked

      # 5.1: the shipped build's compiled-in requirement, which nothing can replace.
      - name: the gate's compiled-in requirement (macOS, release)
        if: runner.os == 'macOS'
        run: cargo test --release -p rlxd --locked --test gate_peer_macos_release

      # --release reuses the build above rather than building gen-schemas again.
      - name: schemas/v1 matches rlxd-proto
        run: cargo run --release --locked -p rlxd-proto --bin gen-schemas -- --check

      # 4.1: Python's registry reads the real rlxd as live while it runs, and as dead
      # after a stop or a kill.
      - name: Python's registry reads rlxd (test_daemon_registry.py)
        working-directory: .
        env:
          RLXD_BIN: ${{ github.workspace }}/rlxd/target/release/rlxd${{ runner.os == 'Windows' && '.exe' || '' }}
        run: uv run --extra dev pytest tests/test_daemon_registry.py -q -p no:cacheprovider

  # Licences and RustSec advisories, once: the dependency graph is the same on every
  # OS, since cargo-deny reads every target's dependencies wherever it runs.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1

      - name: cargo deny check
        run: cargo deny --locked check

  # `rlxd here` over a real `ssh localhost` (the owner's remote brief, §3), as rlx.app runs
  # it: by absolute path, in a non-login session that has not read the user's profile. It
  # must give the answer `env -i HOME=$HOME rlxd here --json` gives locally, in each state.
  # sshd is the runner's own. Its host key is pinned from its own file, not fetched over
  # the connection, and both sides allow public-key auth only. Forwarding the socket over
  # SSH (direct-streamlocal) can extend this job.
  ssh:
    name: rlxd here over ssh (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rlxd -> target

      # check-jsonschema, for the schema checks below.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.0"

      - name: cargo build
        run: cargo build --locked -p rlxd

      - name: Start sshd on localhost, key-only, its host key pinned
        run: |
          if ! command -v sshd >/dev/null && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          # The server takes public keys only.
          printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\n' \
            | sudo tee /etc/ssh/sshd_config.d/10-rlxd-ci.conf >/dev/null
          sudo systemctl restart ssh || sudo service ssh restart
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          chmod go-w ~
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          # The host key, read from the host's own file: pinned, not trusted on first use.
          printf 'localhost %s\n' "$(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" \
            > ~/.ssh/known_hosts
          # Every ssh below: that key only, public-key auth only, never a prompt.
          printf '%s\n' 'Host localhost' '  BatchMode yes' '  StrictHostKeyChecking yes' \
            '  HostKeyAlgorithms ssh-ed25519' '  PreferredAuthentications publickey' \
            '  IdentitiesOnly yes' '  IdentityFile ~/.ssh/id_ed25519' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -G localhost | grep -E '^(batchmode|stricthostkeychecking|preferredauthentications|hostkeyalgorithms) '
          ssh localhost true
          echo "a non-login session's PATH: $(ssh localhost 'echo $PATH')"

      # The step's shell is `bash -e`: an exit the check expects, 3, 5 or 127, is caught
      # with `|| code=$?`.
      - name: rlxd here gives the same answer over ssh as locally
        working-directory: .
        run: |
          rlxd="$PWD/rlxd/target/debug/rlxd"
          over_ssh() { ssh localhost "$@"; }
          # `rlxd here --json` locally with nothing but HOME, and over ssh, into
          # <state>-local.json and <state>-ssh.json. Both must exit $2 and match.
          both() {
            local state=$1 want=$2 code
            code=0; env -i HOME="$HOME" "$rlxd" here --json > "$state-local.json" || code=$?
            [ "$code" = "$want" ] || { echo "::error::$state: local exit $code, not $want"; exit 1; }
            code=0; over_ssh "$rlxd here --json" > "$state-ssh.json" || code=$?
            [ "$code" = "$want" ] || { echo "::error::$state: ssh exit $code, not $want"; exit 1; }
            diff <(jq -S . "$state-local.json") <(jq -S . "$state-ssh.json") \
              || { echo "::error::$state: the answer over ssh differs"; exit 1; }
            jq -c .data "$state-ssh.json"
          }

          both stopped 3
          jq -e '.ok and .data.installed and (.data.running|not) and (.data|has("pid")|not)' stopped-ssh.json

          over_ssh "$rlxd here --json --start" > started-ssh.json
          jq -e '.ok and .data.running and .data.started and .data.pid > 0' started-ssh.json
          pid=$(jq .data.pid started-ssh.json)

          # The session had SSH_CONNECTION and SSH_CLIENT; the rlxd it started has none.
          [ -n "$(over_ssh 'echo "$SSH_CONNECTION"')" ] \
            || { echo "::error::the ssh session has no SSH_CONNECTION"; exit 1; }
          echo "the started rlxd's SSH_ and PATH variables, as ps eww -p $pid shows them:"
          ps eww -p "$pid" | tr ' ' '\n' | grep -E '^(SSH_[A-Z_]*|PATH)=' || true
          tr '\0' '\n' < "/proc/$pid/environ" > daemon-environ.txt
          grep -q '^PATH=' daemon-environ.txt \
            || { echo "::error::the started rlxd's environment was not read"; exit 1; }
          if grep -E '^SSH_[A-Z_]*=' daemon-environ.txt; then
            echo "::error::the rlxd --start started kept the SSH session's variables"; exit 1
          fi

          both running 0
          jq -e --argjson pid "$pid" --arg home "$HOME" '.data.running and (.data.started|not)
            and .data.pid == $pid and .data.socket == ($home + "/.aisquare/run/rlxd.sock")
            and .data.protocol_versions == [1]' running-ssh.json

          # The README's command, as an app sends it, in its three cases. It runs rlxd by
          # absolute path, as on a host whose non-login PATH lacks ~/.local/bin (this
          # runner's has it).
          snippet=$(grep -m1 -E "^sh -c '.*exit 127'\$" rlxd/README.md)
          mkdir -p ~/.local/bin
          cp "$rlxd" ~/.local/bin/rlxd
          over_ssh "$snippet" > snippet-ssh.json
          jq -e --argjson pid "$pid" '.data.running and .data.pid == $pid
            and (.data.rlxd.path|endswith("/.local/bin/rlxd"))' snippet-ssh.json

          uvx check-jsonschema==0.39.0 --schemafile rlxd/schemas/v1/envelope.json -- *-ssh.json *-local.json
          mkdir data
          for answer in *-ssh.json *-local.json; do jq .data "$answer" > "data/$answer"; done
          uvx check-jsonschema==0.39.0 --schemafile rlxd/schemas/v1/here-reply.json -- data/*.json

          over_ssh "$rlxd stop"
          rm ~/.local/bin/rlxd

          # rlx with no rlxd, as on a host with rlx from before 0.10.3: exit 5, rlx's version.
          printf '#!/bin/sh\necho "rlx 0.10.1"\n' > ~/.local/bin/rlx
          chmod 755 ~/.local/bin/rlx
          code=0; said=$(over_ssh "$snippet") || code=$?
          [ "$code" = 5 ] || { echo "::error::rlx and no rlxd: the command exits $code, not 5"; exit 1; }
          [ "$said" = "rlx 0.10.1" ] || { echo "::error::rlx and no rlxd: it said '$said'"; exit 1; }
          rm ~/.local/bin/rlx

          code=0; over_ssh "$snippet" > /dev/null || code=$?
          [ "$code" = 127 ] || { echo "::error::with nothing installed the command exits $code, not 127"; exit 1; }

  # 1.2: rlxd and rlxd-hook for the five targets, as the artifact `rlxd-archives`,
  # installed by `rlx daemon install` on each OS (rlxd-release.yml). It attaches to a
  # release only with a release_tag given by hand, and then only if dry_run is off.
  # contents: write is for that attach job alone; rlxd-release.yml holds every other
  # job to read.
  release:
    name: release
    uses: ./.github/workflows/rlxd-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.release_tag || '' }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
